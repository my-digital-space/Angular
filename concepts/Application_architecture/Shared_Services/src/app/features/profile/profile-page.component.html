<div class="profile-card">
  <div class="card-header">
    <span class="badge">Unrelated Feature</span>
    <h3 class="profile-title">User Profile</h3>
    <p class="profile-desc">
      Demonstrating Step C from Foundation Level: triggering the shared <code>NotifyService</code> singleton from any completely separate component in the tree.
    </p>
  </div>

  <div class="profile-details">
    <div class="field-row">
      <span class="field-label">Name:</span>
      <span class="field-val">Alex Morgan</span>
    </div>
    <div class="field-row">
      <span class="field-label">Membership:</span>
      <span class="field-val">VIP Concert Club</span>
    </div>
  </div>

  <button type="button" class="save-btn" (click)="onSave()">
    Save Profile
  </button>
</div>
