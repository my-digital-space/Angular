<div class="app-layout">
  <!-- Top Navigation Header -->
  <header class="navbar">
    <div class="nav-brand">
      <div class="brand-logo">MFE 1</div>
      <div class="brand-text">
        <span class="brand-title">Build-Time Integration</span>
        <span class="brand-subtitle">Monorepo Workspace Packages</span>
      </div>
    </div>

    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
        Overview
      </a>
      <a routerLink="/orders" routerLinkActive="active" class="nav-item">
        Orders MFE
      </a>
      <a routerLink="/billing" routerLinkActive="active" class="nav-item">
        Billing MFE
      </a>
    </nav>

    <div class="nav-actions">
      <span class="version-tag">{{ angularVersion() }}</span>
      <button class="btn btn-sm btn-outline" (click)="testToast()">
        Trigger Toast
      </button>
    </div>
  </header>

  <!-- Main Content Viewport -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>
      Angular 22+ Production-Grade Micro-Frontends Practice • Pattern 1: Build-Time Integration (Monorepo Packages)
    </p>
  </footer>

  <!-- Toast Notification Overlay -->
  <app-toast-container></app-toast-container>
</div>
